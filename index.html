<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  width:340px;
  background:#111827;
  padding:20px;
  border-radius:18px;
}

.logo-img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
}

select, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

select { background:#1f2937; color:white; }

.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }

.status {
  text-align:center;
  margin-top:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo-img">

<select id="teacher"></select>

<button class="register" onclick="register()">Register</button>
<button class="entry" onclick="mark('ENTRY')">ENTRY</button>
<button class="exit" onclick="mark('EXIT')">EXIT</button>

<div class="status" id="status">Ready</div>

</div>

<script>

const API = "https://attendance-proxy.bhattaraisemant.workers.dev";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(m){
  document.getElementById("status").innerText = m;
}

// LOAD TEACHERS
async function load(){
  try {
    setStatus("Loading teachers...");
    const res = await fetch(API+"?action=getTeachers");
    const d = await res.json();

    const sel = document.getElementById("teacher");
    sel.innerHTML = `<option value="">Select Teacher</option>`;

    d.teachers.forEach(t=>{
      sel.innerHTML += `<option value="${t.code}">${t.code} - ${t.name}</option>`;
    });

    setStatus("Ready");
  } catch (e) {
    setStatus("Failed to load teachers: " + e.message);
  }
}

load();

// REGISTER
async function register(){

  const code = document.getElementById("teacher").value;
  if(!code) return alert("Select teacher");

  setStatus("Registering...");

  try {
    const res = await fetch(API,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        action:"register",
        teacherCode:code,
        deviceId:DEVICE
      })
    });

    const d = await res.json();
    setStatus(d.message);
    alert(d.message);

  } catch (e) {
    setStatus("Error: " + e.message);
    alert("Request failed: " + e.message);
  }
}

// ENTRY / EXIT
function mark(type){

  setStatus("Getting your location...");

  navigator.geolocation.getCurrentPosition(async pos=>{

    const accuracy = pos.coords.accuracy; // radius of uncertainty, in meters

    // If the device can't get a confident fix, refuse rather than risk
    // a falsely "inside school" or "outside school" result
    if (accuracy > 100) {
      setStatus("Location not accurate enough (±" + Math.round(accuracy) + "m)");
      alert("Your location signal is too weak (±" + Math.round(accuracy) + "m). Please go outdoors, enable GPS/Location with high accuracy, and try again.");
      return;
    }

    setStatus("Sending...");

    try {
      const res = await fetch(API,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          action:"markAttendance",
          type:type,
          lat:pos.coords.latitude,
          lng:pos.coords.longitude,
          deviceId:DEVICE
        })
      });

      const d = await res.json();
      setStatus(d.message);
      alert(d.message);

    } catch (e) {
      setStatus("Error: " + e.message);
      alert("Request failed: " + e.message);
    }

  }, err => {
    setStatus("Location error: " + err.message);
    alert("Could not get location: " + err.message);
  }, {
    enableHighAccuracy: true, // force GPS instead of coarse WiFi/network location
    timeout: 15000,
    maximumAge: 0             // never reuse a cached/stale position
  });

}

</script>

</body>
</html>
