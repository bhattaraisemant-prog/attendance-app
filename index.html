<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attendance System</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  box-sizing:border-box;
}

.card {
  width:360px;
  background:#111827;
  padding:20px;
  border-radius:18px;
}

.logo-img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
}

select, button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:none;
  font-size:15px;
  box-sizing:border-box;
}

select { 
  background:#1f2937; 
  color:white;
  appearance:none;
  -webkit-appearance:none;
}

.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }

.status {
  text-align:center;
  margin-top:12px;
  padding:10px;
  font-size:13px;
  background:#1f2937;
  border-radius:8px;
  min-height:20px;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo-img" alt="Logo">

<select id="teacher"></select>

<button class="register" onclick="register()">📝 Register / दर्ता गर्नुहोस्</button>
<button class="entry" onclick="mark('ENTRY')">✅ ENTRY / प्रवेश</button>
<button class="exit" onclick="mark('EXIT')">🚪 EXIT / निस्कास</button>

<div class="status" id="status">Ready / तयार</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxQ5vb2aT2o4nVfu3t7gMJUc5NT9RrNkEHvwEXhiDE3A1Q6GTXKad2aBLhjkL4Yqpc8uA/exec";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(m){
  document.getElementById("status").innerText = m;
}

// LOAD TEACHERS
async function load(){
  try {
    setStatus("Loading... / लोड हुँदै...");
    
    const res = await fetch(API + "?action=getTeachers");
    const d = await res.json();

    const sel = document.getElementById("teacher");
    sel.innerHTML = `<option value="">शिक्षक छान्नुहोस्</option>`;

    if (d.success && d.teachers) {
      d.teachers.forEach(t=>{
        sel.innerHTML += `<option value="${t.code}">${t.code} - ${t.name}</option>`;
      });
      setStatus("✅ Ready / तयार");
    }
  } catch (e) {
    setStatus("❌ Failed / असफल");
  }
}

load();

// REGISTER
async function register(){

  const code = document.getElementById("teacher").value;
  if(!code) {
    alert("कृपया पहिले शिक्षक छान्नुहोस्!\nPlease select teacher first!");
    return;
  }

  setStatus("Registering... / दर्ता हुँदै...");

  try {
    const body = JSON.stringify({
      action: "register",
      teacherCode: code,
      deviceId: DEVICE
    });
    
    console.log("Sending:", body); // Debug

    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body
    });

    const d = await res.json();
    console.log("Response:", d); // Debug
    
    if(d.success) {
      setStatus("✅ " + d.message);
      alert("✅ सफल!\n\n" + d.message);
    } else {
      setStatus("❌ " + d.message);
      alert("❌ असफल!\n\n" + d.message);
    }

  } catch (e) {
    console.error("Error:", e);
    setStatus("❌ दर्ता असफल");
    alert("दर्ता हुन सकेन!\n\nइन्टरनेट जाँच गर्नुहोस्।\nCheck internet connection.");
  }
}

// ENTRY / EXIT
function mark(type){

  const typeNepali = type === "ENTRY" ? "प्रवेश" : "निस्कास";
  
  setStatus("📍 Location लिँदै...");

  if (!navigator.geolocation) {
    alert("GPS उपलब्ध छैन!\nGPS not available!");
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos => {

    const accuracy = pos.coords.accuracy;

    if (accuracy > 200) {
      setStatus("⚠️ GPS कमजोर (±" + Math.round(accuracy) + "m)");
      alert("GPS सिग्नल कमजोर छ!\n\n• खुला ठाउँमा जानुहोस्\n• Go outdoors\n• High Accuracy Mode अन गर्नुहोस्");
      return;
    }

    setStatus("पठाउँदै... / Sending...");

    try {
      const body = JSON.stringify({
        action: "markAttendance",
        type: type,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        deviceId: DEVICE
      });
      
      console.log("Sending:", body);

      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body
      });

      const d = await res.json();
      console.log("Response:", d);
      
      if(d.success) {
        setStatus("✅ " + d.message);
        alert("✅ सफल!\n\n" + typeNepali + " दर्ता भयो।\n" + d.message);
      } else {
        setStatus("❌ " + d.message);
        
        let nepaliMsg = "";
        if(d.message.includes("not registered")) {
          nepaliMsg = "पहिले दर्ता गर्नुहोस्!";
        } else if(d.message.includes("Outside school")) {
          nepaliMsg = "तपाईं स्कूलभन्दा बाहिर हुनुहुन्छ!";
        } else if(d.message.includes("already marked ENTRY")) {
          nepaliMsg = "आज प्रवेश भइसकेको छ!";
        } else if(d.message.includes("already marked EXIT")) {
          nepaliMsg = "आज निस्कास भइसकेको छ!";
        } else if(d.message.includes("Mark ENTRY first")) {
          nepaliMsg = "पहिले प्रवेश गर्नुहोस्!";
        }
        
        alert("❌ असफल!\n\n" + d.message + "\n\n" + nepaliMsg);
      }

    } catch (e) {
      console.error("Error:", e);
      setStatus("❌ पठाउन असफल");
      alert("सर्भरमा जडान हुन सकेन!\n\nइन्टरनेट जाँच गर्नुहोस्।\nCheck internet.");
    }

  }, err => {
    let msg = "";
    
    if(err.code === 1) {
      msg = "GPS अनुमति अस्वीकार!\nSettings मा Location अन गर्नुहोस्।";
    } else if(err.code === 2) {
      msg = "GPS सिग्नल छैन!\nखुला आकाशमुनि जानुहोस्।";
    } else if(err.code === 3) {
      msg = "GPS टाइमआउट!\nखुला ठाउँमा गएर फेरि प्रयास गर्नुहोस्।";
    }
    
    setStatus("❌ GPS Error");
    alert(msg);
    
  }, {
    enableHighAccuracy: true,
    timeout: 30000,
    maximumAge: 0
  });

}

</script>

</body>
</html>
