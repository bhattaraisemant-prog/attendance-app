<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attendance System</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  width:340px;
  background:#111827;
  padding:20px;
  border-radius:18px;
}

.logo-img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
}

select, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

select { background:#1f2937; color:white; }

.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }

.status {
  text-align:center;
  margin-top:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo-img">

<select id="teacher"></select>

<button class="register" onclick="register()">Register</button>
<button class="entry" onclick="mark('ENTRY')">ENTRY</button>
<button class="exit" onclick="mark('EXIT')">EXIT</button>

<div class="status" id="status">Ready</div>

</div>

<script>

// YOUR WORKING API URL
const API = "https://script.google.com/macros/s/AKfycbxQ5vb2aT2o4nVfu3t7gMJUc5NT9RrNkEHvwEXhiDE3A1Q6GTXKad2aBLhjkL4Yqpc8uA/exec";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(m){
  document.getElementById("status").innerText = m;
}

// LOAD TEACHERS
async function load(){
  try {
    setStatus("Loading teachers...");
    
    // FIXED: Proper URL format
    const res = await fetch(API + "?action=getTeachers");
    const d = await res.json();
    
    console.log("Teachers response:", d); // Debug

    const sel = document.getElementById("teacher");
    sel.innerHTML = `<option value="">Select Teacher</option>`;

    if (d.success && d.teachers) {
      d.teachers.forEach(t=>{
        sel.innerHTML += `<option value="${t.code}">${t.code} - ${t.name}</option>`;
      });
      setStatus("Ready");
    } else {
      setStatus("No teachers found. Check sheet.");
    }
  } catch (e) {
    console.error("Load error:", e);
    setStatus("Failed to load: " + e.message);
  }
}

load();

// REGISTER
async function register(){

  const code = document.getElementById("teacher").value;
  if(!code) return alert("Select teacher");

  setStatus("Registering...");

  try {
    const res = await fetch(API,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        action:"register",
        teacherCode:code,
        deviceId:DEVICE
      })
    });

    const d = await res.json();
    console.log("Register response:", d); // Debug
    
    setStatus(d.message);
    alert(d.message);

  } catch (e) {
    console.error("Register error:", e);
    setStatus("Error: " + e.message);
    alert("Request failed: " + e.message);
  }
}

// ENTRY / EXIT
function mark(type){

  setStatus("Getting your location...");

  // Check GPS
  if (!navigator.geolocation) {
    setStatus("GPS not supported");
    alert("Your device doesn't support GPS.");
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos => {

    const accuracy = pos.coords.accuracy;

    if (accuracy > 200) {
      setStatus("GPS too weak (±" + Math.round(accuracy) + "m)");
      alert("GPS signal weak (±" + Math.round(accuracy) + "m).\n\nGo outdoors and enable High Accuracy mode.");
      return;
    }

    setStatus("Sending...");

    try {
      const res = await fetch(API,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          action:"markAttendance",
          type:type,
          lat:pos.coords.latitude,
          lng:pos.coords.longitude,
          deviceId:DEVICE
        })
      });

      const d = await res.json();
      console.log("Mark response:", d); // Debug
      
      setStatus(d.message);
      alert(d.message);

    } catch (e) {
      console.error("Mark error:", e);
      setStatus("Error: " + e.message);
      alert("Request failed: " + e.message);
    }

  }, err => {
    let msg = "";
    if(err.code === 1) msg = "GPS denied. Enable in settings.";
    else if(err.code === 2) msg = "GPS unavailable. Go outdoors.";
    else if(err.code === 3) msg = "GPS timeout. Try again.";
    else msg = "GPS error: " + err.message;
    
    setStatus(msg);
    alert(msg);
  }, {
    enableHighAccuracy: true,
    timeout: 30000,
    maximumAge: 0
  });

}

</script>

</body>
</html>
