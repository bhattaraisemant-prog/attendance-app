<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  width:340px;
  background:#111827;
  padding:20px;
  border-radius:18px;
}

.logo-img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
}

select, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

select { background:#1f2937; color:white; }

.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }

.status {
  text-align:center;
  margin-top:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo-img">

<select id="teacher"></select>

<button class="register" onclick="register()">Register</button>
<button class="entry" onclick="mark('ENTRY')">ENTRY</button>
<button class="exit" onclick="mark('EXIT')">EXIT</button>

<div class="status" id="status">Ready</div>

</div>

<script>

const API = "https://attendance-proxy.bhattaraisemant.workers.dev";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(m){
  document.getElementById("status").innerText = m;
}

// LOAD TEACHERS
async function load(){
  const res = await fetch(API+"?action=getTeachers");
  const d = await res.json();

  const sel = document.getElementById("teacher");
  sel.innerHTML = `<option value="">Select Teacher</option>`;

  d.teachers.forEach(t=>{
    sel.innerHTML += `<option value="${t.code}">${t.code} - ${t.name}</option>`;
  });
}

load();

// REGISTER
async function register(){

const code = document.getElementById("teacher").value;
if(!code) return alert("Select teacher");

setStatus("Registering...");

const res = await fetch(API,{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({
    action:"register",
    teacherCode:code,
    deviceId:DEVICE
  })
});

const d = await res.json();
setStatus(d.message);
alert(d.message);
}

// ENTRY / EXIT
function mark(type){

navigator.geolocation.getCurrentPosition(async pos=>{

setStatus("Sending...");

const res = await fetch(API,{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({
    action:"markAttendance",
    type:type,
    lat:pos.coords.latitude,
    lng:pos.coords.longitude,
    deviceId:DEVICE
  })
});

const d = await res.json();
setStatus(d.message);
alert(d.message);

});

}

</script>

</body>
</html>
