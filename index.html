<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attendance System</title>
<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  box-sizing:border-box;
}
.card {
  width:350px;
  background:#111827;
  padding:20px;
  border-radius:18px;
}
.logo-img {
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
}
select, button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
  box-sizing:border-box;
}
select { background:#1f2937; color:white; }
.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }
.status {
  text-align:center;
  margin-top:12px;
  padding:10px;
  font-size:13px;
  background:#1f2937;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="card">

<img src="logo.png" class="logo-img" onerror="this.style.display='none'">

<select id="teacher"></select>

<button class="register" onclick="register()">📝 Register / दर्ता</button>
<button class="entry" onclick="mark('ENTRY')">✅ ENTRY / प्रवेश</button>
<button class="exit" onclick="mark('EXIT')">🚪 EXIT / निस्कास</button>

<div class="status" id="status">Loading...</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxQ5vb2aT2o4nVfu3t7gMJUc5NT9RrNkEHvwEXhiDE3A1Q6GTXKad2aBLhjkL4Yqpc8uA/exec";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(m) {
  document.getElementById("status").innerText = m;
}

// LOAD TEACHERS
async function load() {
  try {
    setStatus("Loading teachers...");
    
    let res = await fetch(API + "?action=getTeachers");
    let d = await res.json();
    
    console.log(d); // Check in browser console
    
    let sel = document.getElementById("teacher");
    sel.innerHTML = '<option value="">Select Teacher</option>';
    
    if (d.success && d.teachers && d.teachers.length > 0) {
      for (let i = 0; i < d.teachers.length; i++) {
        let t = d.teachers[i];
        sel.innerHTML += '<option value="' + t.code + '">' + t.code + ' - ' + t.name + '</option>';
      }
      setStatus("✅ Ready - " + d.teachers.length + " teachers");
    } else {
      setStatus("No teachers found");
    }
  } catch(e) {
    console.error(e);
    setStatus("❌ Error loading");
    alert("Cannot connect. Please check internet.");
  }
}

load();

// REGISTER
async function register() {
  let code = document.getElementById("teacher").value;
  if (!code) {
    alert("Please select teacher first!");
    return;
  }
  
  setStatus("Registering...");
  
  try {
    let res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        action: "register",
        teacherCode: code,
        deviceId: DEVICE
      })
    });
    
    let d = await res.json();
    console.log(d);
    
    setStatus(d.message);
    alert(d.message);
  } catch(e) {
    console.error(e);
    setStatus("❌ Failed");
    alert("Network error! Check internet.");
  }
}

// MARK ATTENDANCE
function mark(type) {
  setStatus("📍 Getting GPS...");
  
  if (!navigator.geolocation) {
    alert("GPS not available on this device!");
    return;
  }
  
  navigator.geolocation.getCurrentPosition(async function(pos) {
    
    let acc = pos.coords.accuracy;
    console.log("GPS Accuracy: " + acc + "m");
    
    if (acc > 200) {
      setStatus("⚠️ Weak GPS: " + Math.round(acc) + "m");
      alert("GPS signal weak! Go outdoors.\nGPS कमजोर! खुला ठाउँमा जानुहोस्।");
      return;
    }
    
    setStatus("Sending...");
    
    try {
      let res = await fetch(API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          action: "markAttendance",
          type: type,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          deviceId: DEVICE
        })
      });
      
      let d = await res.json();
      console.log(d);
      
      setStatus(d.message);
      alert(d.message);
    } catch(e) {
      console.error(e);
      setStatus("❌ Failed");
      alert("Network error!");
    }
    
  }, function(err) {
    let msg = "";
    if (err.code === 1) msg = "GPS denied. Enable in Settings.";
    if (err.code === 2) msg = "GPS unavailable. Go outdoors.";
    if (err.code === 3) msg = "GPS timeout. Try again.";
    setStatus("❌ " + msg);
    alert(msg);
  }, {
    enableHighAccuracy: true,
    timeout: 30000,
    maximumAge: 0
  });
}

</script>
</body>
</html>
