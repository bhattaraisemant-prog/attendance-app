<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  width:340px;
  background:#111827;
  padding:20px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* HEADER */
.header {
  text-align:center;
  margin-bottom:15px;
}

/* LOGO FROM GITHUB */
.logo-img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
  background:white;
  padding:3px;
}

.title {
  font-size:18px;
  font-weight:bold;
}

.subtitle {
  font-size:12px;
  color:#9ca3af;
}

/* FORM */
select, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

select {
  background:#1f2937;
  color:white;
}

button {
  cursor:pointer;
  font-weight:bold;
}

.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }

.status {
  text-align:center;
  margin-top:12px;
  font-size:13px;
  color:#9ca3af;
}
</style>
</head>

<body>

<div class="card">

<!-- HEADER -->
<div class="header">

  <!-- 🔥 YOUR GITHUB logo.png LINK -->
  <img src="https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/logo.png" class="logo-img">

  <div class="title">Systematic Attendance System</div>
  <div class="subtitle">Teacher Entry & Exit Tracking</div>

</div>

<select id="teacher">
<option>Loading...</option>
</select>

<button class="register" onclick="register()">Register Device</button>
<button class="entry" onclick="mark('ENTRY')">ENTRY</button>
<button class="exit" onclick="mark('EXIT')">EXIT</button>

<div class="status" id="status">Ready</div>

</div>

<script>

const API = "https://attendance-proxy.bhattaraisemant.workers.dev";

// unique device id
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

// LOAD TEACHERS
async function loadTeachers(){
  try {
    const res = await fetch(API + "?action=getTeachers");
    const data = await res.json();

    const sel = document.getElementById("teacher");
    sel.innerHTML = `<option value="">Select Teacher</option>`;

    data.teachers.forEach(t=>{
      const opt = document.createElement("option");
      opt.value = t.code;
      opt.innerText = t.code + " - " + t.name;
      sel.appendChild(opt);
    });

  } catch(e){
    setStatus("Failed to load teachers");
  }
}

loadTeachers();

// REGISTER
async function register(){

const code = document.getElementById("teacher").value;
if(!code) return alert("Select teacher");

setStatus("Registering...");

const res = await fetch(API,{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({
    action:"register",
    teacherCode:code,
    deviceId:DEVICE
  })
});

const data = await res.json();
setStatus(data.message);
alert(data.message);
}

// ENTRY / EXIT
function mark(type){

navigator.geolocation.getCurrentPosition(async pos=>{

setStatus("Sending attendance...");

const res = await fetch(API,{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({
    action:"markAttendance",
    type:type,
    lat:pos.coords.latitude,
    lng:pos.coords.longitude,
    deviceId:DEVICE
  })
});

const data = await res.json();
setStatus(data.message);
alert(data.message);

},()=>{
  alert("GPS denied");
});

}

</script>

</body>
</html>
