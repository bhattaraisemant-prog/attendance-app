<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attendance System</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  width:340px;
  background:#111827;
  padding:20px;
  border-radius:18px;
}

.logo-img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
}

select, button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

select { background:#1f2937; color:white; }

.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }

.status {
  text-align:center;
  margin-top:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo-img">

<select id="teacher"></select>

<button class="register" onclick="register()">Register</button>
<button class="entry" onclick="mark('ENTRY')">ENTRY</button>
<button class="exit" onclick="mark('EXIT')">EXIT</button>

<div class="status" id="status">Ready</div>

</div>

<script>

// ============================================
// CONFIGURATION - CHANGE THIS URL
// ============================================
const API = "https://script.google.com/macros/s/AKfycbxQ5vb2aT2o4nVfu3t7gMJUc5NT9RrNkEHvwEXhiDE3A1Q6GTXKad2aBLhjkL4Yqpc8uA/exec";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(m){
  document.getElementById("status").innerText = m;
}

// ============================================
// LOAD TEACHERS
// ============================================
async function load(){
  try {
    setStatus("Loading teachers...");
    
    const res = await fetch(API + "?action=getTeachers");
    
    if (!res.ok) {
      throw new Error("Server error: " + res.status);
    }
    
    const d = await res.json();

    const sel = document.getElementById("teacher");
    sel.innerHTML = `<option value="">Select Teacher</option>`;

    if (d.teachers && d.teachers.length > 0) {
      d.teachers.forEach(t=>{
        sel.innerHTML += `<option value="${t.code}">${t.code} - ${t.name}</option>`;
      });
      setStatus("Ready");
    } else {
      setStatus("No teachers found");
    }
  } catch (e) {
    console.error(e);
    setStatus("Failed to load teachers");
    
    // Retry after 3 seconds if failed
    setTimeout(() => {
      if (document.getElementById("teacher").options.length <= 1) {
        load();
      }
    }, 3000);
  }
}

load();

// ============================================
// REGISTER
// ============================================
async function register(){

  const code = document.getElementById("teacher").value;
  if(!code) return alert("Select teacher");

  setStatus("Registering...");

  try {
    const res = await fetch(API,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        action:"register",
        teacherCode:code,
        deviceId:DEVICE
      })
    });

    if (!res.ok) {
      throw new Error("Server error: " + res.status);
    }

    const d = await res.json();
    setStatus(d.message);
    alert(d.message);

  } catch (e) {
    console.error(e);
    setStatus("Registration failed");
    alert("Registration failed. Check your connection.");
  }
}

// ============================================
// ENTRY / EXIT - FIXED GPS
// ============================================
function mark(type){

  setStatus("Getting your location...");

  // Check if geolocation is available
  if (!navigator.geolocation) {
    setStatus("GPS not supported on this device");
    alert("Your device does not support GPS.");
    return;
  }

  // GPS options - FIXED for mobile
  const options = {
    enableHighAccuracy: true,  // Use GPS satellite
    timeout: 30000,             // 30 seconds (increased from 15)
    maximumAge: 0               // No cached position
  };

  navigator.geolocation.getCurrentPosition(
    // SUCCESS CALLBACK
    async function(pos) {
      
      const accuracy = pos.coords.accuracy;

      // Allow up to 200m accuracy (more relaxed)
      if (accuracy > 200) {
        setStatus("Location not accurate enough (±" + Math.round(accuracy) + "m)");
        alert("GPS signal too weak (±" + Math.round(accuracy) + "m).\n\nPlease:\n1. Go outdoors\n2. Enable High Accuracy mode\n3. Wait for GPS to stabilize\n4. Try again");
        return;
      }

      setStatus("Sending...");

      try {
        const res = await fetch(API,{
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({
            action:"markAttendance",
            type:type,
            lat:pos.coords.latitude,
            lng:pos.coords.longitude,
            deviceId:DEVICE
          })
        });

        if (!res.ok) {
          throw new Error("Server error: " + res.status);
        }

        const d = await res.json();
        setStatus(d.message);
        alert(d.message);

      } catch (e) {
        console.error(e);
        setStatus("Failed to send data");
        alert("Could not connect to server. Check internet.");
      }

    },
    
    // ERROR CALLBACK
    function(err) {
      let errorMsg = "";
      
      switch(err.code) {
        case 1: // PERMISSION_DENIED
          errorMsg = "Location permission denied.\n\nEnable GPS:\n• iPhone: Settings > Privacy > Location Services\n• Android: Settings > Location > ON";
          break;
        case 2: // POSITION_UNAVAILABLE
          errorMsg = "GPS signal not available.\n\nPlease:\n• Go outdoors (not inside building)\n• Enable High Accuracy mode\n• Wait 10 seconds\n• Try again";
          break;
        case 3: // TIMEOUT
          errorMsg = "GPS timed out.\n\nTips:\n• Go to open area (away from buildings)\n• Turn ON GPS/Location\n• Set to High Accuracy mode\n• Restart phone if continues";
          break;
        default:
          errorMsg = "Location error: " + err.message;
      }
      
      setStatus("Location error");
      alert(errorMsg);
      
    },
    
    options
  );

}

</script>

</body>
</html>
