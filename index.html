<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Teacher Attendance</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1565c0,#42a5f5);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:92%;
max-width:420px;
background:#fff;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 30px rgba(0,0,0,0.2);
}

.logo{
width:100px;
margin-bottom:10px;
}

h2{
color:#1565c0;
margin:10px 0;
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:none;
font-size:16px;
}

select{
background:#f1f6ff;
}

button{
background:#1565c0;
color:white;
font-weight:bold;
cursor:pointer;
}

.exit{
background:#e53935;
}

#panel{
display:none;
}

.info{
margin:15px 0;
font-size:18px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo"/>
<h2>Teacher Attendance</h2>

<div id="register">
<select id="teacher">
<option value="">Select Teacher</option>
<option value="001">001 - Suruchi Sah</option>
<option value="002">002 - Deepa Sah</option>
<option value="003">003 - Manorama Sah</option>
<option value="004">004 - Phulmati Sah</option>
<option value="005">005 - Priyanka Singh</option>
<option value="006">006 - Chandani Sah</option>
<option value="007">007 - Mamta Yadav</option>
<option value="008">008 - Sangita Pajiyar</option>
<option value="009">009 - Diksha Ray</option>
<option value="010">010 - Mamata Sah</option>
<option value="011">011 - Jaya Sah</option>
<option value="012">012 - Pratiksha Thakur A</option>
<option value="013">013 - Anjali Sah</option>
<option value="014">014 - Rajani Chaudhary</option>
<option value="015">015 - Laxmi Singh</option>
<option value="016">016 - Khushbu Jaiswal</option>
<option value="017">017 - Radhika Chaudhary</option>
<option value="018">018 - Nutan Karn</option>
<option value="019">019 - Suriya Sah</option>
<option value="020">020 - Mamta Ghising</option>
<option value="021">021 - Pratiksha Thakur B</option>
<option value="022">022 - Anupama Karn</option>
<option value="023">023 - Shivani Jha</option>
<option value="024">024 - Nagendra Mijar</option>
<option value="025">025 - Satyendra Karn</option>
<option value="026">026 - Pramod Kumar Pandit</option>
<option value="027">027 - Rajeev Kr. Karn</option>
<option value="028">028 - Ramsnehi Thakur</option>
<option value="029">029 - Ajay Singh</option>
<option value="030">030 - Shankar Thakur</option>
<option value="031">031 - Bibhuti Mukhiya</option>
</select>

<button onclick="register()">Register Device</button>

</div>

<div id="panel">

<div class="info" id="name"></div>

<button onclick="mark('ENTRY')">ENTRY</button> <button class="exit" onclick="mark('EXIT')">EXIT</button>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxQ5vb2aT2o4nVfu3t7gMJUc5NT9RrNkEHvwEXhiDE3A1Q6GTXKad2aBLhjkL4Yqpc8uA/exec";

const DEVICE=localStorage.deviceId||crypto.randomUUID();
localStorage.deviceId=DEVICE;

async function post(data){
const r=await fetch(API,{
method:"POST",
body:JSON.stringify(data)
});
return r.json();
}

async function checkUser(){

const res=await post({
action:"teacher",
deviceId:DEVICE
});

if(res.success){
document.getElementById("register").style.display="none";
document.getElementById("panel").style.display="block";
document.getElementById("name").innerText=
res.teacher.teacherName+" ("+res.teacher.teacherCode+")";
}

}

async function register(){

const code=document.getElementById("teacher").value;

if(!code){
alert("Select teacher");
return;
}

const res=await post({
action:"register",
teacherCode:code,
deviceId:DEVICE
});

alert(res.message||"Done");

checkUser();
}

function mark(type){

navigator.geolocation.getCurrentPosition(async pos=>{

const res=await post({
action:"attendance",
type:type,
lat:pos.coords.latitude,
lng:pos.coords.longitude,
deviceId:DEVICE
});

alert(res.message||"Done");

});

}

checkUser();

</script>

</body>
</html>
