<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attendance System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.card{
  width:100%;
  max-width:360px;
  background:#111827;
  padding:25px 20px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.logo-img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 15px auto;
  border:3px solid #3b82f6;
  background:#1e293b;
}
select,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
  box-sizing:border-box;
}
select{
  background:#1f2937;
  color:white;
  -webkit-appearance:none;
  appearance:none;
}
button{
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}
button:active{
  opacity:0.8;
  transform:scale(0.98);
}
.register{background:#3b82f6;color:white;}
.entry{background:#22c55e;color:white;}
.exit{background:#ef4444;color:white;}
.status{
  text-align:center;
  margin-top:15px;
  padding:12px;
  font-size:14px;
  background:#1f2937;
  border-radius:8px;
  min-height:20px;
  line-height:1.5;
}
.info{
  text-align:center;
  margin-top:12px;
  font-size:11px;
  color:#64748b;
}
</style>
</head>
<body>

<div class="card">

<img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none'">

<select id="teacher"><option value="">Loading...</option></select>

<button class="register" onclick="registerDevice()">📝 Register / दर्ता गर्नुहोस्</button>
<button class="entry" onclick="markAttendance('ENTRY')">✅ ENTRY / प्रवेश</button>
<button class="exit" onclick="markAttendance('EXIT')">🚪 EXIT / निस्कास</button>

<div class="status" id="status">Ready / तयार</div>
<div class="info">Must be within 400m of school | Entry: 5AM-4PM</div>

</div>

<script>

// Your working Cloudflare Worker URL
const API = "https://attendance-proxy.bhattaraisemant.workers.dev";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

// ==========================================
// LOAD TEACHERS
// ==========================================
async function loadTeachers(){
  try{
    setStatus("Loading teachers... / लोड हुँदै...");
    
    const response = await fetch(API + "?action=getTeachers");
    const data = await response.json();
    
    console.log("Teachers loaded:", data);
    
    const sel = document.getElementById("teacher");
    
    if(data.success && data.teachers && data.teachers.length > 0){
      sel.innerHTML = '<option value="">Select Teacher / शिक्षक छान्नुहोस्</option>';
      
      data.teachers.forEach(function(t){
        sel.innerHTML += '<option value="' + t.code + '">' + t.code + ' - ' + t.name + '</option>';
      });
      
      setStatus("✅ Ready / तयार (" + data.teachers.length + " teachers)");
    } else {
      sel.innerHTML = '<option value="">No teachers found</option>';
      setStatus("❌ No teachers / शिक्षक भेटिएन");
    }
  } catch(e){
    console.error("Load error:", e);
    document.getElementById("teacher").innerHTML = '<option value="">Failed to load</option>';
    setStatus("❌ Connection failed / जडान असफल");
  }
}

// ==========================================
// REGISTER DEVICE
// ==========================================
async function registerDevice(){
  const code = document.getElementById("teacher").value;
  
  if(!code){
    alert("Please select teacher first!\nकृपया पहिले शिक्षक छान्नुहोस्");
    return;
  }
  
  setStatus("Registering... / दर्ता हुँदै...");
  
  try{
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        action: "register",
        teacherCode: code,
        deviceId: DEVICE
      })
    });
    
    const data = await response.json();
    console.log("Register response:", data);
    
    if(data.success){
      setStatus("✅ " + data.message);
      alert("✅ Success / सफल!\n\n" + data.message);
    } else {
      setStatus("❌ " + data.message);
      alert("❌ Failed / असफल\n\n" + data.message);
    }
  } catch(e){
    console.error("Register error:", e);
    setStatus("❌ Registration failed / दर्ता असफल");
  }
}

// ==========================================
// MARK ATTENDANCE
// ==========================================
function markAttendance(type){
  
  const typeNepali = type === "ENTRY" ? "प्रवेश" : "निस्कास";
  
  setStatus("📍 Getting GPS... / GPS लिँदै...");
  
  if(!navigator.geolocation){
    alert("GPS not available!\nGPS उपलब्ध छैन!");
    return;
  }
  
  const options = {
    enableHighAccuracy: true,
    timeout: 30000,
    maximumAge: 0
  };
  
  navigator.geolocation.getCurrentPosition(
    async function(pos){
      
      const accuracy = pos.coords.accuracy;
      
      if(accuracy > 200){
        setStatus("⚠️ Weak GPS (±" + Math.round(accuracy) + "m)");
        alert("GPS signal too weak!\nGPS सिग्नल कमजोर!\n\nGo outdoors.\nखुला ठाउँमा जानुहोस्।");
        return;
      }
      
      setStatus("📤 Sending... / पठाउँदै...");
      
      try{
        const response = await fetch(API, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            action: "markAttendance",
            type: type,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            deviceId: DEVICE
          })
        });
        
        const data = await response.json();
        console.log("Mark response:", data);
        
        if(data.success){
          setStatus("✅ " + data.message);
          alert("✅ Success / सफल!\n\n" + typeNepali + " - " + data.message);
        } else {
          setStatus("❌ " + data.message);
          
          let nepaliMsg = "";
          if(data.message.includes("not registered")) nepaliMsg = "पहिले दर्ता गर्नुहोस्!";
          else if(data.message.includes("Outside school")) nepaliMsg = "स्कूलभन्दा बाहिर!";
          else if(data.message.includes("already marked ENTRY")) nepaliMsg = "आज प्रवेश भइसकेको छ!";
          else if(data.message.includes("already marked EXIT")) nepaliMsg = "आज निस्कास भइसकेको छ!";
          else if(data.message.includes("Mark ENTRY first")) nepaliMsg = "पहिले प्रवेश गर्नुहोस्!";
          else if(data.message.includes("only after 5 AM")) nepaliMsg = "बिहान ५ बजेपछि मात्र!";
          else if(data.message.includes("after 4 PM")) nepaliMsg = "४ बजेपछि हुँदैन!";
          
          alert("❌ Failed / असफल\n\n" + data.message + "\n\n" + nepaliMsg);
        }
      } catch(e){
        console.error("Mark error:", e);
        setStatus("❌ Failed / असफल");
      }
    },
    function(err){
      let msg = "";
      if(err.code === 1) msg = "GPS permission denied!\nSettings मा GPS अन गर्नुहोस्";
      else if(err.code === 2) msg = "GPS unavailable!\nखुला आकाशमुनि जानुहोस्";
      else if(err.code === 3) msg = "GPS timeout!\nफेरि प्रयास गर्नुहोस्";
      else msg = "GPS error";
      
      setStatus("❌ " + msg);
      alert(msg);
    },
    options
  );
}

// Start the app
loadTeachers();

</script>
</body>
</html>
