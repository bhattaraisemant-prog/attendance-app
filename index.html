<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance System</title>
</head>

<body style="margin:0;font-family:Arial;background:linear-gradient(135deg,#0d47a1,#42a5f5);display:flex;justify-content:center;align-items:center;height:100vh;">

<div style="background:white;width:92%;max-width:420px;padding:20px;border-radius:18px;text-align:center;">

<img src="logo.png" style="width:80px;border-radius:10px;">

<h2>Teacher Attendance</h2>

<select id="teacher" style="width:100%;padding:10px;">
<option>Loading...</option>
</select>

<br><br>

<button onclick="register()" style="width:100%;padding:12px;background:#0d47a1;color:white;border:none;">
Register
</button>

<br><br>

<button onclick="mark('ENTRY')" style="width:48%;padding:10px;background:green;color:white;border:none;">
ENTRY
</button>

<button onclick="mark('EXIT')" style="width:48%;padding:10px;background:red;color:white;border:none;">
EXIT
</button>

</div>

<script>

const API = "https://attendance-proxy.bhattaraisemant.workers.dev";

const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

async function post(data){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify(data)
  });
  return res.json();
}

// LIVE LOAD TEACHERS
async function loadTeachers(){

  const res = await fetch(API + "?action=getTeachers");
  const data = await res.json();

  const select = document.getElementById("teacher");
  select.innerHTML = `<option value="">Select Teacher</option>`;

  data.teachers.forEach(t=>{
    const opt = document.createElement("option");
    opt.value = t.code;
    opt.innerText = `${t.code} - ${t.name}`;
    select.appendChild(opt);
  });
}

setInterval(loadTeachers, 10000);
loadTeachers();

async function register(){

const code = document.getElementById("teacher").value;
if(!code) return alert("Select teacher");

const res = await post({
action:"register",
teacherCode:code,
deviceId:DEVICE
});

alert(res.message);
}

function mark(type){

navigator.geolocation.getCurrentPosition(async pos=>{

const res = await post({
action:"markAttendance",
type:type,
lat:pos.coords.latitude,
lng:pos.coords.longitude,
deviceId:DEVICE
});

alert(res.message);

});

}

</script>

</body>
</html>
