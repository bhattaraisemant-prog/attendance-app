<button onclick="register()" style="width:100%;padding:12px;background:#0d47a1;color:white;border:none;border-radius:10px;font-size:15px;">
Register Device
</button>

<br><br>

<button onclick="mark('ENTRY')" style="width:48%;padding:12px;background:#2e7d32;color:white;border:none;border-radius:10px;">
ENTRY
</button>

<button onclick="mark('EXIT')" style="width:48%;padding:12px;background:#c62828;color:white;border:none;border-radius:10px;">
EXIT
</button>

</div>

<script>

const API = "https://attendance-proxy.bhattaraisemant.workers.dev";

const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

async function post(data){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify(data)
  });
  return res.json();
}

async function register(){

const code = document.getElementById("teacher").value;

if(!code){
alert("Select Teacher");
return;
}

const res = await post({
action:"register",
teacherCode:code,
deviceId:DEVICE
});

alert(res.message);
document.getElementById("status").innerText = res.message;

}

function mark(type){

navigator.geolocation.getCurrentPosition(async pos=>{

const res = await post({
action:"markAttendance",
type:type,
lat:pos.coords.latitude,
lng:pos.coords.longitude,
deviceId:DEVICE
});

alert(res.message);
document.getElementById("status").innerText = res.message;

});

}

</script>
