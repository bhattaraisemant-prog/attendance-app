<script>

const API = "https://script.google.com/macros/s/AKfycbxQ5vb2aT2o4nVfu3t7gMJUc5NT9RrNkEHvwEXhiDE3A1Q6GTXKad2aBLhjkL4Yqpc8uA/exec";

const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

async function send(data){

  try{
    const res = await fetch(API, {
      method: "POST",
      body: JSON.stringify(data)
    });

    return await res.json();

  } catch(e){
    alert("Network error");
    return {success:false};
  }
}

async function checkUser(){

  const r = await send({
    action:"teacher",
    deviceId: DEVICE
  });

  if(r && r.success){

    document.getElementById("register").style.display="none";
    document.getElementById("panel").style.display="block";

    document.getElementById("name").innerText =
      r.teacher.teacherName + " (" + r.teacher.teacherCode + ")";
  }
}

async function register(){

  const code = document.getElementById("teacher").value;

  if(!code){
    alert("Select teacher");
    return;
  }

  const r = await send({
    action:"register",
    teacherCode: code,
    deviceId: DEVICE
  });

  alert(r.message || "Done");

  checkUser();
}

function mark(type){

  if(!navigator.geolocation){
    alert("GPS not supported");
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos=>{

    const r = await send({
      action:"attendance",
      type: type,
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      deviceId: DEVICE
    });

    alert(r.message || "Done");

  },()=>{
    alert("Location permission denied");
  });

}

checkUser();

</script>
