<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance</title>
</head>

<body style="font-family:Arial;text-align:center;margin-top:50px;">

<h2>Teacher Attendance System</h2>

<select id="teacher">
<option value="">Select Teacher</option>
<option value="001">001</option>
<option value="002">002</option>
<option value="003">003</option>
</select>

<br><br>

<button onclick="register()">Register</button>
<button onclick="mark('ENTRY')">ENTRY</button>
<button onclick="mark('EXIT')">EXIT</button>

<script>

const API = "https://attendance-proxy.bhattaraisemant.workers.dev";

const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

async function post(data){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify(data)
  });
  return res.json();
}

async function register(){

const code = document.getElementById("teacher").value;

if(!code){
alert("Select teacher");
return;
}

const res = await post({
action:"register",
teacherCode:code,
deviceId:DEVICE
});

alert(res.message);

}

function mark(type){

navigator.geolocation.getCurrentPosition(async pos=>{

const res = await post({
action:"markAttendance",
type:type,
lat:pos.coords.latitude,
lng:pos.coords.longitude,
deviceId:DEVICE
});

alert(res.message);

});

}

</script>

</body>
</html>
