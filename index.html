<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attendance</title>
<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  box-sizing:border-box;
}
.card {
  width:350px;
  background:#111827;
  padding:20px;
  border-radius:18px;
}
.logo-img {
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 10px auto;
}
select, button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
  box-sizing:border-box;
}
select { background:#1f2937; color:white; }
.register { background:#3b82f6; color:white; }
.entry { background:#22c55e; color:white; }
.exit { background:#ef4444; color:white; }
.status {
  text-align:center;
  margin-top:12px;
  padding:10px;
  font-size:13px;
  background:#1f2937;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="card">

<img src="logo.png" class="logo-img" onerror="this.style.display='none'">

<select id="teacher"></select>

<button class="register" onclick="register()">📝 Register</button>
<button class="entry" onclick="mark('ENTRY')">✅ ENTRY</button>
<button class="exit" onclick="mark('EXIT')">🚪 EXIT</button>

<div class="status" id="status">Ready</div>

</div>

<script>

// PASTE YOUR NEW URL HERE AFTER DEPLOY
const API = "https://script.google.com/macros/s/YOUR_NEW_URL/exec";
const DEVICE = localStorage.deviceId || (localStorage.deviceId = crypto.randomUUID());

function setStatus(m) {
  document.getElementById("status").innerText = m;
}

// LOAD TEACHERS
async function load() {
  try {
    setStatus("Loading...");
    var res = await fetch(API + "?action=getTeachers");
    var d = await res.json();
    
    var sel = document.getElementById("teacher");
    sel.innerHTML = '<option value="">Select Teacher</option>';
    
    if (d.teachers) {
      d.teachers.forEach(function(t) {
        sel.innerHTML += '<option value="' + t.code + '">' + t.code + ' - ' + t.name + '</option>';
      });
      setStatus("Ready");
    }
  } catch(e) {
    setStatus("Failed to load");
  }
}
load();

// REGISTER
async function register() {
  var code = document.getElementById("teacher").value;
  if (!code) return alert("Select teacher");
  
  setStatus("Registering...");
  
  try {
    var res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        action: "register",
        teacherCode: code,
        deviceId: DEVICE
      })
    });
    
    var d = await res.json();
    setStatus(d.message);
    alert(d.message);
  } catch(e) {
    setStatus("Failed");
    alert("Network error");
  }
}

// MARK ATTENDANCE
function mark(type) {
  setStatus("Getting GPS...");
  
  if (!navigator.geolocation) {
    alert("GPS not available");
    return;
  }
  
  navigator.geolocation.getCurrentPosition(async function(pos) {
    
    var acc = pos.coords.accuracy;
    if (acc > 200) {
      setStatus("GPS weak: " + Math.round(acc) + "m");
      alert("GPS weak. Go outdoors.");
      return;
    }
    
    setStatus("Sending...");
    
    try {
      var res = await fetch(API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          action: "markAttendance",
          type: type,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          deviceId: DEVICE
        })
      });
      
      var d = await res.json();
      setStatus(d.message);
      alert(d.message);
    } catch(e) {
      setStatus("Failed");
      alert("Network error");
    }
    
  }, function(err) {
    var msg = "GPS error";
    if (err.code === 1) msg = "GPS denied";
    if (err.code === 2) msg = "GPS unavailable";
    if (err.code === 3) msg = "GPS timeout";
    setStatus(msg);
    alert(msg);
  }, {
    enableHighAccuracy: true,
    timeout: 30000,
    maximumAge: 0
  });
}

</script>
</body>
</html>
